<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadHunter AI — Admin Security Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: rgba(18, 24, 38, 0.95);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #f97316;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-body);
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(249, 115, 22, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 45%);
            background-attachment: fixed;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(16px);
            text-align: center;
        }
        .brand-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px auto;
        }
        .login-title {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 6px;
            color: #ffffff;
        }
        .login-title span { color: var(--primary); }
        .login-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 28px;
        }
        .form-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }
        .form-input {
            width: 100%;
            padding: 13px 44px 13px 16px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }
        .form-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .toggle-pwd-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        .error-banner {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #f87171;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .security-foot {
            margin-top: 24px;
            font-size: 0.78rem;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-icon">⚡</div>
        <h1 class="login-title">LeadHunter<span>.AI</span> Admin</h1>
        <p class="login-subtitle">Enter security password to access workspace</p>

        <div id="errorBanner" class="error-banner"></div>

        <form id="loginForm" onsubmit="handleLoginSubmit(event)">
            <div class="form-group">
                <input type="password" id="passwordInput" class="form-input" placeholder="Enter admin password..." required autofocus>
                <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility()">👁️</button>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">
                <span>🔑</span> Unlock Dashboard
            </button>
        </form>

        <div class="security-foot">
            🛡️ Encrypted Session Security Active
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const input = document.getElementById("passwordInput");
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const password = document.getElementById("passwordInput").value;
            const errorBanner = document.getElementById("errorBanner");
            const btnSubmit = document.getElementById("btnSubmit");

            errorBanner.style.display = "none";
            btnSubmit.innerHTML = "<span>⏳</span> Verifying...";
            btnSubmit.disabled = true;

            try {
                const res = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (data.status === "ok") {
                    const params = new URLSearchParams(window.location.search);
                    const redirectUrl = params.get("from") || "/dashboard";
                    window.location.href = redirectUrl;
                } else {
                    errorBanner.innerText = data.message || "Invalid security password. Please try again.";
                    errorBanner.style.display = "block";
                }
            } catch (err) {
                errorBanner.innerText = "Connection error. Please try again.";
                errorBanner.style.display = "block";
            } finally {
                btnSubmit.innerHTML = "<span>🔑</span> Unlock Dashboard";
                btnSubmit.disabled = false;
            }
        }
    </script>
</body>
</html>
