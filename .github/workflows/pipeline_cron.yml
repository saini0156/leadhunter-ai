name: LeadHunter AI 24/7 Automated Pipeline

on:
  schedule:
    # Runs automatically every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    # Allows manual 1-click execution from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "psycopg[binary]"

      - name: Execute LeadHunter AI Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEMO_BASE_URL: ${{ secrets.DEMO_BASE_URL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          DRY_RUN: "false"
        run: |
          python main.py
